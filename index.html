<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Class Resources</title>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="./favicon_io/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./favicon_io/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="./favicon_io/favicon-16x16.png" />

		<link rel="stylesheet" href="style.css?v=3.1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
			rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
			rel="stylesheet" />

		<script src="vendor/jszip.min.js"></script>
		<script src="vendor/file-saver.min.js"></script>

		<script>
			// Set theme before paint to avoid a flash
			(function () {
				const saved = localStorage.getItem("theme");
				const dark = matchMedia("(prefers-color-scheme: dark)").matches;
				document.documentElement.dataset.theme =
					saved === "light" || saved === "dark"
						? saved
						: dark
							? "dark"
							: "light";
			})();
		</script>
	</head>
	<body>
		<header class="app-bar">
			<div class="container">
				<div class="toolbar">
					<div class="titles">
						<h1>Class Resources</h1>
					</div>
					<p class="semester-count" id="subtitle">7TH SEMESTER</p>
					<div class="toolbar-actions">
						<a
							class="icon-btn"
							href="about.html"
							aria-label="About this site"
							title="About">
							<span class="icon" aria-hidden="true">info</span>
						</a>
						<a
							class="icon-btn"
							href="changelog.html"
							aria-label="Open changelog"
							title="Changelog">
							<span class="icon" aria-hidden="true">history</span>
						</a>
						<a
							class="icon-btn"
							href="https://github.com/ShadowAmitendu/ClassResources"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Open GitHub repository">
							<span class="github-mark" aria-hidden="true">
								<svg
									viewBox="0 0 24 24"
									width="24"

									fill="currentColor">
									<path
										d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.091-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.272.098-2.65 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.344c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.378.202 2.397.1 2.65.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.338-.012 2.419-.012 2.747 0 .268.18.579.688.481A10.001 10.001 0 0 0 22 12c0-5.523-4.477-10-10-10Z" />
								</svg>
							</span>
						</a>
						<button
							id="theme-toggle"
							class="icon-btn"
							aria-label="Toggle theme">
							<span class="icon">dark_mode</span>

					</div>
				</div>

				<div class="tabs" role="tablist" aria-label="Semester">
					<button
						class="tab"
						data-sem="1st"

						aria-selected="false"

						<span class="icon">looks_one</span><span>1st</span>

					<button

					<button
						class="tab"
						data-sem="3rd"
						role="tab"
						aria-selected="false"
						aria-controls="main-content">
						<span class="icon">looks_3</span><span>3rd</span>
					</button>
					<button
						class="tab"
						data-sem="4th"
						role="tab"
						aria-selected="false"
						aria-controls="main-content">
						<span class="icon">looks_4</span><span>4th</span>
					</button>
					<button
						class="tab"
						data-sem="5th"
						role="tab"
						aria-selected="false"
						aria-controls="main-content">
						<span class="icon">looks_5</span><span>5th</span>

					<button
						class="tab"
						data-sem="6th"
						role="tab"
						aria-selected="false"

						<span class="icon">inventory_2</span><span>6th</span>

						data-sem="7th"

						data-sem="8th"
						role="tab"
						aria-selected="false"

				</div>
				<div class="mobile-semester">
					<label for="semester-select">Semester</label>
					<select id="semester-select" aria-label="Select semester">
						<option value="1st">1ST SEMESTER</option>
						<option value="2nd">2ND SEMESTER</option>
						<option value="3rd">3RD SEMESTER</option>
						<option value="4th">4TH SEMESTER</option>
						<option value="5th">5TH SEMESTER</option>
						<option value="6th">6TH SEMESTER</option>

		<main
			class="container"
			id="main-content"
			role="tabpanel"
			aria-live="polite">
			<div class="explorer-bar">
				<div class="explorer-search">
					<span class="icon" aria-hidden="true">search</span>
					<input
						type="search"
						id="file-search"
						placeholder="Search notes, subjects, assignments..."
						aria-label="Search resources" />
				</div>
				<div class="explorer-actions">
					<button
						id="toggle-all-folders"
						class="btn btn-outlined btn-sm"
						title="Expand all folders"
						aria-label="Expand all folders">
						<span class="icon" id="toggle-all-icon" aria-hidden="true">unfold_more</span>
						<span class="btn-text hide-sm" id="toggle-all-text">Expand all</span>
					</button>
					<button
						id="view-mode-toggle"
						class="btn btn-outlined btn-sm"
						title="Toggle between Tree List and Folder Grid view"
						aria-label="Switch to Folder Grid View">
						<span class="icon" id="view-mode-icon" aria-hidden="true">grid_view</span>
						<span class="btn-text hide-sm" id="view-mode-text">Folder view</span>
					</button>
				</div>
			</div>
			<div id="sections-container"></div>
		</main>

		<footer>
			<div class="container">
				<div class="footer-meta">
					<span class="footer-hosted">GitHub Pages</span>
					<span class="footer-sep">•</span>
					<a class="footer-link" href="about.html">About</a>
					<span class="footer-sep">•</span>
					<a class="footer-link" href="terms.html">Terms</a>
					<span class="footer-sep">•</span>
					<a class="footer-link" href="changelog.html">Changelog</a>
				</div>
				<div class="footer-center">
					<a
						class="footer-author"
						href="https://amitendu.me"
						target="_blank"
						rel="noopener noreferrer">
						Amitendu Bikash Dhusiya
					</a>
				</div>
				<div class="footer-right">
					<span class="footer-updated" id="updated"></span>
				</div>
			</div>
		</footer>

		<div class="snackbar" id="snackbar" role="status"></div>

		<script>
			const SECTIONS = [
				{ id: "syllabus", title: "Syllabus", icon: "book_2" },
				{ id: "notes", title: "Lecture notes", icon: "article" },
				{ id: "assignments", title: "Assignments", icon: "assignment" },
				{ id: "question-papers", title: "Question papers", icon: "quiz" },
			];
			const FILES = Object.fromEntries(
				["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th"].map(
					(semester) => [semester, `bca/data/${semester}.json`],
				),
			);
			const EXT_ICONS = {
				pdf: "picture_as_pdf",
				doc: "description",
				docx: "description",
				xls: "table_view",
				xlsx: "table_view",
				ppt: "slideshow",
				pptx: "slideshow",
				zip: "archive",
				rar: "archive",
				"7z": "archive",
				jpg: "image",
				jpeg: "image",
				png: "image",
				gif: "image",
				html: "code",
				css: "code",
				js: "code",
				py: "code",
				java: "code",
				c: "code",
				cpp: "code",
			};

			let currentSem = "7th";
			const $ = (id) => document.getElementById(id);
			const main = $("main-content");

			const icon = (name, cls = "") =>
				`<span class="icon ${cls}" aria-hidden="true">${name}</span>`;
			const esc = (s) =>
				String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
			const iconFor = (name) =>
				EXT_ICONS[name.split(".").pop().toLowerCase()] || "draft";
			const flatten = (items) =>
				items.flatMap((i) =>
					i.type === "file" ? [i] : i.type === "dir" ? flatten(i.children) : [],
				);

			function toast(msg) {
				const el = $("snackbar");
				el.textContent = msg;
				el.classList.add("show");
				clearTimeout(toast.t);
				toast.t = setTimeout(() => el.classList.remove("show"), 3000);
			}

			/* ---------- Rendering ---------- */
			function renderItems(items) {
				return items
					.map((item) => {
						if (item.type === "file") {
							const ext = iconFor(item.name);
							const safeUrl = esc(item.url);
							return `<li><a class="row" href="${safeUrl}" target="_blank" rel="noopener noreferrer">
						${icon(ext, "file-icon " + ext)}<span class="name">${esc(item.name)}</span>${icon("download", "muted")}
					</a></li>`;
						}
						if (item.type === "dir") {
							return `<li class="folder">
						<button class="row folder-btn" aria-expanded="false">
							${icon("folder", "muted folder-icon")}<span class="name">${esc(item.name)}</span>
							<span class="badge">${flatten(item.children).length}</span>${icon("expand_more", "muted chevron")}
						</button>
						<div class="collapse"><ul>${renderItems(item.children)}</ul></div>
					</li>`;
						}
						return "";
					})
					.join("");
			}

			function renderSection(s, items) {
				const count = flatten(items).length;
				return `<section class="card${count ? "" : " empty-card"}" data-section="${s.id}">
				<div class="card-head">
					<span class="avatar">${icon(s.icon)}</span>
					<div class="grow"><h2>${s.title}</h2><span class="muted-text">${count} file${count === 1 ? "" : "s"}</span></div>
					${
						count
							? `<button class="btn download" data-id="${s.id}">${icon("download")}<span class="hide-sm">Download all</span></button>`
							: `<span class="empty-status">${icon("inbox", "empty-status-icon")}<span>Nothing here yet</span></span>`
					}
				</div>
				${count || items.length ? `<ul class="list">${renderItems(items)}</ul>` : ""}
			</section>`;
			}

			function renderNoticeBanner(sem, totalFiles) {
				if (sem === "8th") {
					return `<div class="card notice-banner notice-warning">
					<span class="notice-icon">${icon("event_busy")}</span>
					<div class="notice-body">
						<h3>8th Semester Syllabus Not Available</h3>
						<p>No syllabus has been given or announced by the university yet, so there is no way to curate or add 8th-semester resources at this time. Study materials will be added as soon as the official syllabus is published.</p>
						<div class="notice-actions">
							<a href="https://github.com/ShadowAmitendu/ClassResources/issues/new?template=resource-submission.yml" target="_blank" rel="noopener noreferrer" class="btn btn-outlined">
								${icon("notifications")} Got syllabus updates? Let us know
							</a>
						</div>
					</div>
				</div>`;
				}
				if (totalFiles === 0) {
					return `<div class="card notice-banner notice-info">
					<span class="notice-icon">${icon("construction")}</span>
					<div class="notice-body">
						<h3>Resources in Preparation</h3>
						<p>Content for ${sem.toUpperCase()} SEMESTER is going to be added later as files are collected, but without any guarantee of availability or specific timeline. Student contributions are always welcome!</p>
						<div class="notice-actions">
							<a href="https://github.com/ShadowAmitendu/ClassResources/issues/new?template=resource-submission.yml" target="_blank" rel="noopener noreferrer" class="btn btn-outlined">
								${icon("upload_file")} Contribute resources
							</a>
						</div>
					</div>
				</div>`;
				}
				return "";
			}

			const sectionsContainer = $("sections-container");

			/* ---------- View Mode & Explorer Controls ---------- */
			let currentView = localStorage.getItem("view-mode") || "list";
			function applyViewMode(mode) {
				currentView = mode;
				localStorage.setItem("view-mode", mode);
				const isGrid = mode === "grid";
				main.classList.toggle("view-grid", isGrid);
				$("view-mode-icon").textContent = isGrid ? "view_list" : "grid_view";
				$("view-mode-text").textContent = isGrid ? "List view" : "Folder view";
				$("view-mode-toggle").setAttribute(
					"title",
					isGrid ? "Switch to List View" : "Switch to Folder Grid View",
				);
			}
			applyViewMode(currentView);

			$("view-mode-toggle").addEventListener("click", () => {
				applyViewMode(currentView === "grid" ? "list" : "grid");
			});

			let allExpanded = false;
			$("toggle-all-folders").addEventListener("click", () => {
				allExpanded = !allExpanded;
				document.querySelectorAll(".folder").forEach((f) => {
					f.classList.toggle("open", allExpanded);
					const btn = f.querySelector(":scope > .folder-btn");
					if (btn) {
						btn.setAttribute("aria-expanded", allExpanded);
						const ic = btn.querySelector(".folder-icon");
						if (ic) ic.textContent = allExpanded ? "folder_open" : "folder";
					}
				});
				$("toggle-all-icon").textContent = allExpanded
					? "unfold_less"
					: "unfold_more";
				$("toggle-all-text").textContent = allExpanded
					? "Collapse all"
					: "Expand all";
			});

			$("file-search").addEventListener("input", (e) => {
				const query = e.target.value.trim().toLowerCase();
				const sections = document.querySelectorAll(
					"#sections-container section.card",
				);
				sections.forEach((sec) => {
					const rows = sec.querySelectorAll(".list li");
					let visibleCount = 0;
					if (!query) {
						rows.forEach((li) => (li.style.display = ""));
						sec.style.display = "";
						return;
					}
					rows.forEach((li) => {
						const nameEl = li.querySelector(".name");
						const name = nameEl ? nameEl.textContent.toLowerCase() : "";
						const matches = name.includes(query);
						if (matches) {
							li.style.display = "";
							visibleCount++;
							let p = li.parentElement.closest(".folder");
							while (p) {
								p.classList.add("open");
								p.style.display = "";
								const btn = p.querySelector(":scope > .folder-btn");
								if (btn) {
									btn.setAttribute("aria-expanded", "true");
									const ic = btn.querySelector(".folder-icon");
									if (ic) ic.textContent = "folder_open";
								}
								p = p.parentElement.closest(".folder");
							}
						} else if (!li.classList.contains("folder")) {
							li.style.display = "none";
						}
					});
					sec.style.display = visibleCount > 0 ? "" : "none";
				});
			});

			async function load(sem) {
				sectionsContainer.innerHTML = SECTIONS.map(
					() => `<div class="card skeleton"></div>`,
				).join("");
				$("file-search").value = "";
				allExpanded = false;
				$("toggle-all-icon").textContent = "unfold_more";
				$("toggle-all-text").textContent = "Expand all";

				try {
					const res = await fetch(`${FILES[sem]}?t=${Date.now()}`);
					if (!res.ok) {
						sectionsContainer.innerHTML = renderNoticeBanner(sem, 0);
						$("updated").textContent = "";
						return;
					}
					const data = await res.json();
					const totalFiles = SECTIONS.reduce(
						(acc, s) => acc + flatten(data[s.id] || []).length,
						0,
					);

					$("updated").textContent = data.metadata?.lastUpdated
						? `Updated ${data.metadata.lastUpdated}`
						: "";
					sectionsContainer.innerHTML =
						SECTIONS.map((s) => renderSection(s, data[s.id] || [])).join("") +
						renderNoticeBanner(sem, totalFiles);
					main._data = data;
				} catch (e) {
					console.error(e);
					sectionsContainer.innerHTML = `<div class="card error">${icon("warning")}<h3>Error loading files</h3>
					<p>Make sure you ran <b>generate.py</b> before uploading.</p></div>`;
				}
			}

			/* ---------- Events (delegated) ---------- */
			main.addEventListener("click", (e) => {
				const folder = e.target.closest(".folder-btn");
				if (folder) {
					const li = folder.parentElement;
					const open = li.classList.toggle("open");
					folder.setAttribute("aria-expanded", open);
					folder.querySelector(".folder-icon").textContent = open
						? "folder_open"
						: "folder";
					return;
				}
				const dl = e.target.closest(".download");
				if (dl) downloadAll(dl);
			});

			document.querySelector(".tabs").addEventListener("click", (e) => {
				const tab = e.target.closest(".tab");
				if (!tab || tab.dataset.sem === currentSem) return;
				currentSem = tab.dataset.sem;
				document.querySelectorAll(".tab").forEach((t) => {
					const on = t === tab;
					t.classList.toggle("active", on);
					t.setAttribute("aria-selected", on);
				});
				$("subtitle").textContent = `${currentSem} SEMESTER`.toUpperCase();
				load(currentSem);
			});

			document
				.querySelector("#semester-select")
				.addEventListener("change", (e) => {
					currentSem = e.target.value;
					document.querySelectorAll(".tab").forEach((tab) => {
						const active = tab.dataset.sem === currentSem;
						tab.classList.toggle("active", active);
						tab.setAttribute("aria-selected", active);
					});
					$("subtitle").textContent = `${currentSem} SEMESTER`.toUpperCase();
					load(currentSem);
				});

			/* ---------- Bulk download ---------- */
			async function downloadAll(btn) {
				const id = btn.dataset.id;
				const files = flatten(main._data[id] || []);
				if (!files.length) return toast("Nothing to download");

				const original = btn.innerHTML;
				btn.disabled = true;
				btn.innerHTML = `${icon("sync", "spin")}<span class="hide-sm">Zipping…</span>`;
				try {
					const zip = new JSZip();
					await Promise.all(
						files.map(async (f) => {
							try {
								const blob = await (await fetch(f.path)).blob();
								const parts = f.path.split("/");
								const semesterIndex = parts.indexOf("semesters");
								if (semesterIndex < 0) throw new Error("Invalid resource path");
								const archivePath = parts.slice(semesterIndex + 2).join("/");
								if (!archivePath) throw new Error("Invalid archive path");
								zip.file(archivePath, blob);
							} catch {
								console.error("Skipped:", f.name);
							}
						}),
					);
					saveAs(
						await zip.generateAsync({ type: "blob" }),
						`${id}_${currentSem}_sem.zip`,
					);
					toast("Download ready");
				} catch (e) {
					console.error(e);
					toast("Error zipping files");
				}
				btn.innerHTML = original;
				btn.disabled = false;
			}

			/* ---------- Theme ---------- */
			const themeBtn = $("theme-toggle");
			const syncThemeIcon = () => {
				themeBtn.firstElementChild.textContent =
					document.documentElement.dataset.theme === "dark"
						? "light_mode"
						: "dark_mode";
			};
			function setTheme(next) {
				document.documentElement.dataset.theme = next;
				localStorage.setItem("theme", next);
				syncThemeIcon();
			}
			themeBtn.addEventListener("click", (event) => {
				const next =
					document.documentElement.dataset.theme === "dark" ? "light" : "dark";
				const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
				if (!document.startViewTransition || reduce) return setTheme(next);

				// Compute ripple origin at click coordinate or center of toggle button
				const r = themeBtn.getBoundingClientRect();
				const x = event.clientX || r.left + r.width / 2;
				const y = event.clientY || r.top + r.height / 2;
				const maxRadius = Math.hypot(
					Math.max(x, window.innerWidth - x),
					Math.max(y, window.innerHeight - y),
				);

				themeBtn.classList.add("theme-switching");

				const transition = document.startViewTransition(() => {
					setTheme(next);
				});

				transition.ready
					.then(() => {
						const anim = document.documentElement.animate(
							{
								clipPath: [
									`circle(0px at ${x}px ${y}px)`,
									`circle(${maxRadius}px at ${x}px ${y}px)`,
								],
							},
							{
								duration: 650,
								easing: "cubic-bezier(0.16, 1, 0.3, 1)",
								fill: "forwards",
								pseudoElement: "::view-transition-new(root)",
							},
						);
						return anim.finished;
					})
					.catch(() => {})
					.finally(() => {
						themeBtn.classList.remove("theme-switching");
					});
			});
			syncThemeIcon();
			load(currentSem);
		</script>
	</body>
</html>
